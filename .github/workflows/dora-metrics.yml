
name: DORA Metrics

on:
  workflow_dispatch:
  schedule:
    # 매일 한국 시간 오전 9시 (UTC 00:00)
    - cron: "0 0 * * *"

permissions:
  contents: read
  pull-requests: read
  deployments: read

jobs:
  collect-dora:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect DORA metrics
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/collect_dora.py

      - name: Upload DORA report
        uses: actions/upload-artifact@v4
        with:
          name: dora-metrics-${{ github.run_id }}
          path: reports/
          retention-days: 90
          if-no-files-found: error

